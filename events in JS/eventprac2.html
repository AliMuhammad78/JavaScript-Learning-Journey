<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Rock Paper </title>
    <link rel="stylesheet" href="eventprac2.css">
</head>
<body>
    <h1> Rock paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="pic1">
            <img src="pic1.jpg" alt="">
        </div>
        <div class="choice" id="pic2">
            <img src="pic2.jpg" alt="">
        </div>
        <div class="choice" id="image3">
            <img src="image3.jpeg" alt="">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>you</p>

            <p id="comp-score">0</p>
            <p>comp </p>
        </div>
    </div>
    

    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
</body>
<script src="eventprac2.js"></script>
</html>
